name: AI Server Setup

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  setup-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Complete Configuration
        run: |
          set -e

          echo "=== 1. Creating Secure Admin User ==="
          sudo useradd -m -s /bin/bash -p "$(openssl passwd -1 123)" aiadmin || true
          sudo usermod -aG sudo aiadmin || true

          echo "=== 2. Configuring SSH Service ==="
          sudo apt-get update -y
          sudo apt-get install -y openssh-server curl
          sudo systemctl enable ssh
          sudo systemctl restart ssh

          echo "=== 3. Installing Official Ollama AI ==="
          # دانلود اسکریپت در یک فایل مجزا برای جلوگیری از خطای پایپ و سینتکس شبکه
          curl -fsSL https://ollama.com -o install_ollama.sh
          chmod +x install_ollama.sh
          sudo ./install_ollama.sh

          echo "=== 4. Activating External Web API & CORS ==="
          # ایجاد پوشه تنظیمات بدون استفاده از ساختار خطرساز cat <<EOF
          sudo mkdir -p /etc/systemd/system/ollama.service.d
          echo '[Service]' | sudo tee /etc/systemd/system/ollama.service.d/override.conf
          echo 'Environment="OLLAMA_HOST=0.0.0.0:11434"' | sudo tee -a /etc/systemd/system/ollama.service.d/override.conf
          echo 'Environment="OLLAMA_ORIGINS=*"' | sudo tee -a /etc/systemd/system/ollama.service.d/override.conf

          sudo systemctl daemon-reload
          sudo systemctl enable ollama
          sudo systemctl restart ollama

          echo "=== 5. Pulling Qwen 2.5 Coding Model ==="
          # دانلود نسخه کاملاً بهینه شده برای پردازنده‌های کلود بدون کرش رم
          ollama pull qwen2.5-coder:1.5b

          echo "=== 6. Extracting Server IP ==="
          PUBLIC_IP=$(curl -s https://ipify.org || hostname -I | awk '{print $1}')

          echo "=================================================="
          echo "           🚀 OLLAMA AI RUNNING WITHOUT BUGS      "
          echo "=================================================="
          echo "  USER:        aiadmin"
          echo "  PASSWORD:    123"
          echo "  SSH:         ssh aiadmin@$PUBLIC_IP"
          echo "  API URL:     http://$PUBLIC_IP:11434"
          echo "  MODEL:       qwen2.5-coder:1.5b"
          echo "=================================================="
          
          echo "=== 7. Testing Ollama Connection ==="
          echo "Verifying local Ollama endpoint response:"
          curl -s http://127.0.0
          echo ""

          # زنده نگه داشتن سرور برای پردازش‌های بعدی
          echo "Keeping server alive..."
          sleep 14400
