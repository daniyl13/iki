name: AI Server Setup

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  setup-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Complete Configuration
        run: |
          set -e # جلوگیری از توقف با خطاهای کاذب

          echo "=== 1. Creating Secure Admin User ==="
          # حل باگ کاربر ادمین با تغییر نام به aiadmin و ساخت اصولی آن
          sudo useradd -m -s /bin/bash -p "$(openssl passwd -1 123)" aiadmin || true
          sudo usermod -aG sudo aiadmin || true

          echo "=== 2. Configuring SSH Service ==="
          sudo apt-get update -y
          sudo apt-get install -y openssh-server
          sudo systemctl enable ssh
          sudo systemctl restart ssh

          echo "=== 3. Installing Official Ollama AI ==="
          curl -fsSL https://ollama.com | sh

          echo "=== 4. Activating External Web API & CORS ==="
          sudo mkdir -p /etc/systemd/system/ollama.service.d
          sudo bash -c 'cat > /etc/systemd/system/ollama.service.d/override.conf <<EOF
          [Service]
          Environment="OLLAMA_HOST=0.0.0.0:11434"
          Environment="OLLAMA_ORIGINS=*"
          EOF'

          sudo systemctl daemon-reload
          sudo systemctl enable ollama
          sudo systemctl restart ollama

          echo "=== 5. Pulling Qwen 2.5 Coding Model ==="
          # استفاده از نسخه سبک‌تر و پایدارتر برای محیط کلود اکشنز
          ollama pull qwen2.5-coder:1.5b

          echo "=== 6. Extracting Server IP ==="
          PUBLIC_IP=$(curl -s https://ipify.org || hostname -I | awk '{print $1}')

          echo "=================================================="
          echo "           🚀 OLLAMA AI RUNNING WITHOUT BUGS      "
          echo "=================================================="
          echo "  USER:        aiadmin"
          echo "  PASSWORD:    123"
          echo "  SSH:         ssh aiadmin@$PUBLIC_IP"
          echo "  API URL:     http://$PUBLIC_IP:11434"
          echo "  MODEL:       qwen2.5-coder:1.5b"
          echo "=================================================="
          
          echo "=== 7. Starting Local Chat Interface inside Terminal ==="
          echo "You can type and test your model directly right here:"
          echo "--------------------------------------------------"
          
          # اجرای مستقیم مدل در محیط لاگ گیت‌هاب تا بدون نیاز به آی‌پابلیک بتوانید از آن استفاده کنید
          ollama run qwen2.5-coder:1.5b "Hello, introduce yourself briefly."

          # زنده نگه داشتن سرور برای پردازش‌های بعدی
          echo "Keeping server alive..."
          sleep 14400
