name: Run AI and Remote Desktop

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  setup-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Script
        run: |
          # ۱. ساخت کاربر ادمین
          sudo useradd -m -s /bin/bash admin || true
          echo "admin:123" | sudo chpasswd
          sudo usermod -aG sudo admin

          # ۲. نصب و راه‌اندازی SSH
          sudo apt update
          sudo apt install -y openssh-server
          sudo systemctl enable ssh
          sudo systemctl restart ssh

          # ۳. نصب و راه‌اندازی Remote Desktop (RDP)
          sudo apt install -y ubuntu-desktop xrdp
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          # ۴. نصب نسخه رسمی Ollama AI
          curl -fsSL https://ollama.com | sh

          # ۵. فعال کردن API بیرونی به صورت استاندارد
          sudo mkdir -p /etc/systemd/system/ollama.service.d
          sudo bash -c 'cat > /etc/systemd/system/ollama.service.d/override.conf <<EOF
          [Service]
          Environment="OLLAMA_HOST=0.0.0.0:11434"
          Environment="OLLAMA_ORIGINS=*"
          EOF'

          # ۶. اعمال تغییرات سرویس اولاما
          sudo systemctl daemon-reload
          sudo systemctl enable ollama
          sudo systemctl restart ollama

          # ۷. دانلود مدل کدنویسی
          ollama pull qwen2.5-coder:7b

          # ۸. استخراج آی‌پای سرور موقت گیت‌هاب
          PUBLIC_IP=$(curl -s https://ipify.org || hostname -I | awk '{print $1}')

          # ۹. نمایش اطلاعات نهایی
          echo "=================================================="
          echo "                AI SERVER IS READY                "
          echo "=================================================="
          echo "  USER:      admin"
          echo "  PASSWORD:  123"
          echo "  SSH:       ssh admin@$PUBLIC_IP"
          echo "  RDP:       $PUBLIC_IP:3389"
          echo "  API BASE:  http://$PUBLIC_IP:11434"
          echo "  MODEL:     qwen2.5-coder:7b"
          echo "=================================================="
          
          # نگه داشتن سرور برای اتصال (حداکثر تا ۵ ساعت یا اتمام تایم‌اوت گیت‌هاب)
          echo "Server is running... keeping action alive."
          sleep 18000
