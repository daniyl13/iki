name: AI VPS 10 Session Persistent

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read


jobs:

  session-1:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

    - uses: actions/checkout@v4


    - name: Setup User
      run: |
        sudo useradd -m -s /bin/bash Neotenet || true
        echo "Neotenet:neo_tenet" | sudo chpasswd
        sudo usermod -aG sudo Neotenet

        sudo mkdir -p /home/Neotenet/workspace
        sudo chown -R Neotenet:Neotenet /home/Neotenet


    - name: Install AI
      run: |

        curl -fsSL https://ollama.com/install.sh | sh

        sudo mkdir -p /home/Neotenet/workspace/ollama

        echo "export OLLAMA_MODELS=/home/Neotenet/workspace/ollama" \
        | sudo tee /etc/profile.d/ollama.sh


        ollama serve &

        sleep 10

        ollama pull qwen2.5:3b || true



    - name: Timer
      run: |

        sleep 19800



    - name: Backup
      if: always()
      run: |

        sudo tar -czf /tmp/ai-backup.tar.gz \
        /home/Neotenet \
        /etc/profile.d/ollama.sh \
        /usr/local/bin \
        || true



    - name: Upload Backup
      uses: actions/upload-artifact@v4
      with:

        name: ai-backup-1

        path: /tmp/ai-backup.tar.gz

        retention-days: 1



  session-2:
    needs: session-1
    if: always()

    runs-on: ubuntu-latest
    timeout-minutes: 360


    steps:

    - uses: actions/checkout@v4


    - name: Download Backup
      uses: actions/download-artifact@v4

      with:

        name: ai-backup-1

        path: /tmp



    - name: Restore

      run: |

        sudo tar -xzf /tmp/ai-backup.tar.gz -C /



    - name: Continue AI

      run: |

        curl -fsSL https://ollama.com/install.sh | sh || true

        ollama serve &

        sleep 10



    - name: Timer

      run: |

        sleep 19800



    - name: Backup

      if: always()

      run: |

        sudo tar -czf /tmp/ai-backup.tar.gz \
        /home/Neotenet \
        /etc/profile.d/ollama.sh \
        /usr/local/bin \
        || true



    - name: Upload

      uses: actions/upload-artifact@v4

      with:

        name: ai-backup-2

        path: /tmp/ai-backup.tar.gz

        retention-days: 1
