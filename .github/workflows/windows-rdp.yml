# ساخت کاربر ادمین
sudo useradd -m -s /bin/bash admin || true
echo "admin:123" | sudo chpasswd
sudo usermod -aG sudo admin


# SSH
sudo apt update
sudo apt install -y openssh-server
sudo systemctl enable ssh
sudo systemctl restart ssh



# Remote Desktop
sudo apt install -y ubuntu-desktop xrdp

sudo systemctl enable xrdp
sudo systemctl restart xrdp


# نصب Ollama AI
curl -fsSL https://ollama.com/install.sh | sh


# فعال کردن API بیرونی
sudo mkdir -p /etc/systemd/system


sudo bash -c 'cat > /etc/systemd/system/ollama.service <<EOF
[Unit]
Description=Ollama AI

[Service]
ExecStart=/usr/local/bin/ollama serve
Environment="OLLAMA_HOST=0.0.0.0:11434"
Restart=always

[Install]
WantedBy=multi-user.target
EOF'


sudo systemctl daemon-reload
sudo systemctl enable ollama
sudo systemctl restart ollama



# دانلود مدل کدنویسی
ollama pull qwen2.5-coder:7b



# نمایش اطلاعات
IP=$(hostname -I | awk '{print $1}')

echo "=========================="
echo "AI READY"

echo "USER:"
echo "admin"

echo "PASSWORD:"
echo "123"


echo "SSH:"
echo "ssh admin@$IP"


echo "RDP:"
echo "$IP:3389"


echo "API:"
echo "http://$IP:11434/v1"


echo "MODEL:"
echo "qwen2.5-coder:7b"

echo "=========================="
