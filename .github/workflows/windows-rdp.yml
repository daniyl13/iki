name: Windows Cloud RDP Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Advanced Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "SecurityLayer" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-NetFirewallRule -DisplayGroup "Remote Desktop" -Enabled True -Direction Inbound

      - name: 2. Create Root Admin Account (21s) & Auto Logon
        run: |
          Remove-LocalUser -Name "21s" -ErrorAction SilentlyContinue
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "21s" -Password $Password -Fullname "21s" -Description "Super Administrator"
          Add-LocalGroupMember -Group "Administrators" -Member "21s"
          Set-LocalUser -Name "21s" -PasswordNeverExpires $True

          # Configure Windows Auto Logon (No Password Required on startup)
          $AutoLogonPath = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
          Set-ItemProperty -Path $AutoLogonPath -Name "AutoAdminLogon" -Value "1"
          Set-ItemProperty -Path $AutoLogonPath -Name "DefaultUserName" -Value "21s"
          Set-ItemProperty -Path $AutoLogonPath -Name "DefaultPassword" -Value "P@ssw0rd1qazXSW@#"

      - name: 3. Add Persian Language Support
        run: |
          $LanguageList = Get-WinUserLanguageList
          $LanguageList.Add("fa-IR")
          Set-WinUserLanguageList $LanguageList -Force

      - name: 4. Install Pro Developer Tools & Utilities
        run: |
          Write-Host "Installing Chocolatey and Essential Tools..." -ForegroundColor Cyan
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          
          choco install git nodejs python 7zip vscode -y --no-progress
          refreshenv

      - name: 5. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-pro"
          
          Start-Sleep -Seconds 8
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP PRO SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Hostname     : github-rdp-pro" -ForegroundColor Yellow
          Write-Host "  Username     : 21s (Admin/Root)" -ForegroundColor Yellow
          Write-Host "  Auto-Login   : Enabled (No Password Needed)" -ForegroundColor Yellow
          Write-Host "  >> Connect via mstsc: $ts_ip or github-rdp-pro" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

      - name: 6. Keep Server Alive (48 Hours)
        run: |
          for ($i = 1; $i -le 2880; $i++) {
            Start-Sleep -Seconds 60
            Write-Host "[$i/2880] Pro Server running smoothly..."
          }
