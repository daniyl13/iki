name: Ultimate Fast Root & Runner VPS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 0

    steps:
      - name: 1. Configure RDP, SSH, Sessions & Bypass Security
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "SecurityLayer" -Value 0
          
          Set-ItemProperty -Path 'HKLM:\Software\Policies\Microsoft\Windows NT\Terminal Services' -name "fShadow" -Value 2
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -name "FilterAdministratorToken" -Value 0
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -name "ConsentPromptBehaviorAdmin" -Value 0
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -name "EnableLUA" -Value 0
          
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-NetFirewallRule -DisplayGroup "Remote Desktop" -Enabled True -Direction Inbound
          
          # Install and Configure OpenSSH Server
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 -ErrorAction SilentlyContinue
          Start-Service sshd
          Set-Service -Name sshd -StartupType 'Automatic'
          Enable-NetFirewallRule -Name "OpenSSH-Server-In-TCP" -ErrorAction SilentlyContinue
          
          # Add users and passwords for RDP and SSH
          net user root 123 /add
          net user runneradmin 123 /add

          # Create group and add users to group
          net localgroup "Remote Desktop Users" root /add
          net localgroup Administrators root /add

      - name: 2. Disable Defender & Power Savings
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          powercfg /hibernate off
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          powercfg /change monitor-timeout-ac 0
          powercfg /change disk-timeout-ac 0
          powercfg /change standby-timeout-ac 0

      - name: 3. Fast Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          
          Start-Sleep -Seconds 3
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="fast-root-vps"
          
          Start-Sleep -Seconds 5
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          
          # Print instructions to console
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> FAST ROOT & RUNNER VPS IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Usernames    : root / runneradmin" -ForegroundColor Yellow
          Write-Host "  Password     : 123" -ForegroundColor Yellow
          Write-Host "  >> Connect via mstsc: $ts_ip" -ForegroundColor Magenta
          Write-Host "  >> Connect via SSH CMD:" -ForegroundColor Magenta
          Write-Host "     ssh root@$ts_ip" -ForegroundColor White
          Write-Host "     ssh runneradmin@$ts_ip" -ForegroundColor White
          Write-Host "==================================================" -ForegroundColor Green

      - name: 4. Keep VPS Alive Forever
        run: |
          while (true) {
            Start-Sleep -Seconds 60
          }
