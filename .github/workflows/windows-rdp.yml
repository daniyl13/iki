name: Continuous Windows Cloud RDP

on:
  workflow_dispatch:
  repository_dispatch:
    types: [restart-rdp]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvDAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvDAdmin" -ErrorAction SilentlyContinue
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: 3. Setup Rclone & Restore Data
        env:
          RCLONE_CONFIG_BODY: ${{ secrets.RCLONE_CONFIG_DATA }}
        run: |
          # دانلود و نصب چاکلتری و سپس Rclone
          Set-ExecutionPolicy Bypass -Scope Process -Force; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072; iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org'))
          choco install rclone -y
          
          # ساخت فایل کانفیگ Rclone در مسیر پیش‌فرض ویندوز
          $configPath = "$env:USERPROFILE\.config\rclone"
          if (!(Test-Path $configPath)) { New-Item -ItemType Directory -Path $configPath -Force }
          [System.IO.File]::WriteAllText("$configPath\rclone.conf", $env:RCLONE_CONFIG_BODY)
          
          # ایجاد پوشه مخصوص دیتای پایدار شما در دسکتاپ
          $vpsDataPath = "C:\Users\NvDAdmin\Desktop\VPS_Data"
          if (!(Test-Path $vpsDataPath)) { New-Item -ItemType Directory -Path $vpsDataPath -Force }
          
          # دانلود دیتای قبلی از گوگل درایو (اگر وجود داشته باشد)
          Write-Host "Restoring data from Google Drive..."
          rclone sync gdrive:GitHub_RDP_Backup $vpsDataPath --vfs-cache-mode writes

      - name: 4. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://tailscale.com" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server" --accept-routes
          Start-Sleep -Seconds 8
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : NvdAdmin" -ForegroundColor Yellow
          Write-Host "  Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          Write-Host "  >> IMPORTANT: Put all your files in 'VPS_Data' folder on Desktop!" -ForegroundColor Red
          Write-Host "==================================================" -ForegroundColor Green

      - name: 5. Keep Server Alive & Sync (5.5 Hours)
        run: |
          $vpsDataPath = "C:\Users\NvDAdmin\Desktop\VPS_Data"
          # اجرای سرور به مدت ۳۳۰ دقیقه (۵.۵ ساعت)
          # هر ۵ دقیقه یک‌بار، دیتا را در بک‌گراند روی گوگل‌درایو آپلود می‌کند تا اگر سرور ناگهانی قطع شد دیتا نپرد
          for ($i = 1; $i -le 66; $i++) {
            Start-Sleep -Seconds 300
            Write-Host "[$($i*5)/330 Min] Syncing data to Google Drive..."
            rclone sync $vpsDataPath gdrive:GitHub_RDP_Backup --vfs-cache-mode writes
          }

      - name: 6. Final Data Backup
        if: always()
        run: |
          Write-Host "Performing final backup before shutdown..."
          $vpsDataPath = "C:\Users\NvDAdmin\Desktop\VPS_Data"
          rclone sync $vpsDataPath gdrive:GitHub_RDP_Backup --vfs-cache-mode writes

      - name: 7. Trigger Next Job Automatically
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # این اسکریپت با API گیت‌هاب تماس گرفته و جاب بعدی را فوراً استارت می‌زند
          $owner = "${{ github.repository_owner }}"
          $repo = "${{ github.event.repository.name }}"
          $url = "https://github.com"
          
          $headers = @{
              "Authorization" = "token $env:GH_PAT"
              "Accept"        = "application/vnd.github.v3+json"
          }
          
          $body = @{
              "event_type" = "restart-rdp"
          } | ConvertTo-Json
          
          Invoke-RestMethod -Uri $url -Method Post -Headers $headers -Body $body -ContentType "application/json"
          Write-Host "Next RDP job triggered successfully!"
