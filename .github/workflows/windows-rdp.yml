name: Windows RDP Tunnel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable RDP & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-NetFirewallRule -DisplayGroup "Remote Desktop" -Enabled True -Direction Inbound

      - name: 2. Set Runner Password
        run: |
          net user runneradmin Password123!

      - name: 3. Setup Ngrok Tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          winget install --id Ngrok.Ngrok -e --silent
          ngrok config add-authtoken $env:NGROK_AUTHTOKEN
          Start-Process ngrok -ArgumentList "tcp 3389" -NoNewWindow
          Start-Sleep -Seconds 5
          
          $response = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels"
          $tunnelUrl = $response.tunnels[0].public_url
          
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  RDP TUNNEL IS READY!" -ForegroundColor Cyan
          Write-Host "  Username : runneradmin" -ForegroundColor Yellow
          Write-Host "  Password : Password123!" -ForegroundColor Yellow
          Write-Host "  Address  : $tunnelUrl" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

      - name: 4. Keep Alive
        run: |
          for ($i = 1; $i -le 360; $i++) {
            Start-Sleep -Seconds 60
          }
